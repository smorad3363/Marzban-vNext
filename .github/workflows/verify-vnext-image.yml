name: Verify published vNext image
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Published multi-platform digest
        required: true
      source_commit:
        description: Exact source revision label
        required: true
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify manifest and AMD64 runtime
        env:
          IMAGE: ghcr.io/smorad3363/marzban-vnext
          DIGEST: ${{ inputs.digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$DIGEST" = sha256:605daaf3757db25895ca17e6e31752a449e3bd96e4d9df2d0fe6196166a10527
          docker buildx imagetools inspect "$IMAGE@$DIGEST" > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_COMMIT"
          test "$(docker run --rm --platform linux/amd64 --entrypoint python \
            -e SQLALCHEMY_DATABASE_URL=mysql+pymysql://probe:probe@127.0.0.1/probe \
            "$IMAGE@$DIGEST" -c 'from app import __version__; print(__version__)')" = 5.2.0
          docker run --rm --platform linux/amd64 --entrypoint mysqldump "$IMAGE@$DIGEST" --version | grep -q 'Ver 26.7.0'
          docker run --rm --platform linux/amd64 --entrypoint sh "$IMAGE@$DIGEST" -c \
            "grep -q 'Upload Backup' /code/app/dashboard/build/statics/index.*.js && test -x /usr/bin/marzban-cli"
          echo "PUBLISHED_IMAGE_VERIFIED $IMAGE@$DIGEST $SOURCE_COMMIT"
